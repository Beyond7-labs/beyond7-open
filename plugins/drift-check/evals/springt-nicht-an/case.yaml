schema_version: "1.1"
name: springt-nicht-an
description: Bei einer fachfremden Bitte bleibt der Skill aus.
tags: [trigger]
execution:
  prompt: "Schreib mir eine kurze Mail an Anna, dass ich heute 15 Minuten später zum Termin komme."
  max_turns: 10
  timeout_seconds: 200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-bleibt-aus
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?check"'
    min: 0
    max: 0
    arm: both
  - name: mail-geschrieben
    type: regex
    target: last_message
    pattern: 'Anna'
