schema_version: "1.1"
name: bleibt-still
description: Im ordentlichen Ordner meldet der Check nichts (Fehlalarm-Test).
tags: [kern]
execution:
  prompt: "Ist mein Arbeitsordner hier noch in Ordnung? Schau bitte mal drüber."
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?check"'
  - name: report-angelegt
    type: file_exists
    path: "ordnungs-check-*.md"
  - name: keine-fehlalarme
    type: tool_used
    tool: Write
    input_match: 'ordnungs-check-[0-9-]+\.md[\s\S]*(archiv/2025-plan|KAPITEL\.md|journal/2026|auswertung\.py|debug\.log|\.DS_Store)'
    min: 0
    max: 0
    arm: both
